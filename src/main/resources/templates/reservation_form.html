<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle réservation - HotellbookingMaroc</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            background:
                linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.8)),
                url("https://images.unsplash.com/photo-1597212618440-806262de4f6b?auto=format&fit=crop&w=1920&q=80") center center / cover no-repeat fixed;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(4px);
            background: rgba(15, 23, 42, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }
        header a {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 32px 16px 40px;
        }
        .card {
            background: rgba(248, 250, 252, 0.98);
            max-width: 720px;
            width: 100%;
            padding: 28px 32px 32px;
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(10px);
            color: #0f172a; /* Force dark text inside card */
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }
        .card p {
            margin: 0 0 20px;
            font-size: 14px;
            color: #4b5563;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: #111827;
        }
        input, select {
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.18s ease-out;
            background: white;
        }
        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 1px #2563eb33;
        }
        .full-width {
            grid-column: span 2;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }
        .btn {
            padding: 11px 20px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.18s ease-out;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.45);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 40px rgba(37, 99, 235, 0.55);
        }
        .btn-secondary {
            background: white;
            color: #111827;
            border: 1px solid #d1d5db;
        }
        .btn-secondary:hover {
            background: #f3f4f6;
        }
        .note {
            font-size: 12px;
            color: #6b7280;
        }
        @media (max-width: 720px) {
            .card {
                padding: 22px 18px 26px;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .actions {
                flex-direction: column-reverse;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>HotelBookingPro</h1>
    <nav style="display: flex; gap: 20px;">
        <a href="/" style="color: white; text-decoration: none; opacity: 0.8;">Accueil</a>
        <a href="/hotels" style="color: white; text-decoration: none; opacity: 0.8;">Hôtels</a>
        <a href="/contact" style="color: white; text-decoration: none; opacity: 0.8;">Contact</a>
    </nav>
</header>
<main>
    <div class="card">
        <h2>Nouvelle réservation</h2>
        <p>Saisissez les détails de votre séjour pour réserver votre hôtel au Maroc.</p>

        <!-- Messages de succès ou d'erreur -->
        <div th:if="${success}" style="background: #dcfce7; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bbf7d0;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #fecaca;">
            <span th:text="${error}"></span>
        </div>

        <form action="/reservations" method="post">
            <div class="grid">
                <div class="field">
                    <label for="destination">Destination *</label>
                    <select id="destination" name="destination" required>
                        <option value="">Choisir une ville...</option>
                        <option>Marrakech</option>
                        <option>Casablanca</option>
                        <option>Rabat</option>
                        <option>Tanger</option>
                        <option>Agadir</option>
                        <option>Fès</option>
                        <option>Merzouga</option>
                    </select>
                </div>
                <div class="field">
                    <label for="hotel">Hôtel *</label>
                    <input id="hotel" name="hotel" placeholder="Nom de l’hôtel souhaité" required>
                </div>
                <div class="field">
                    <label for="checkin">Arrivée *</label>
                    <input type="date" id="checkin" name="checkin" required>
                </div>
                <div class="field">
                    <label for="checkout">Départ *</label>
                    <input type="date" id="checkout" name="checkout" required>
                </div>
                <div class="field">
                    <label for="guests">Nombre de personnes *</label>
                    <input type="number" id="guests" name="guests" min="1" value="2" required>
                </div>
                <div class="field">
                    <label for="rooms">Nombre de chambres *</label>
                    <input type="number" id="rooms" name="rooms" min="1" value="1" required>
                </div>
                <div class="field full-width">
                    <label for="notes">Préférences particulières</label>
                    <input id="notes" name="notes" placeholder="Vue piscine, suite, transfert aéroport…">
                </div>
            </div>
            <div class="actions">
                <span class="note">Les informations sont pour l’instant à titre de démonstration.</span>
                <div>
                    <a href="/" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">Confirmer la demande</button>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
