<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${hotel.name} + ' - HotellbookingMaroc'">Détails de l'hôtel - HotellbookingMaroc</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            /* background set dynamically via th:style */
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(4px);
            background: rgba(15, 23, 42, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }
        header a {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
        }
        main {
            flex: 1;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Slider Styles */
        .slider-container {
            width: 100%;
            height: 400px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        .slider-track {
            display: flex;
            width: 800%; /* 8 images */
            height: 100%;
            animation: slide 32s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide {
            width: 12.5%; /* 1/8 */
            height: 100%;
            background-size: cover;
            background-position: center;
        }
        @keyframes slide {
            0%, 9% { transform: translateX(0); }
            12.5%, 21.5% { transform: translateX(-12.5%); }
            25%, 34% { transform: translateX(-25%); }
            37.5%, 46.5% { transform: translateX(-37.5%); }
            50%, 59% { transform: translateX(-50%); }
            62.5%, 71.5% { transform: translateX(-62.5%); }
            75%, 84% { transform: translateX(-75%); }
            87.5%, 96.5% { transform: translateX(-87.5%); }
            100% { transform: translateX(0); }
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        .details-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            color: #0f172a;
        }
        h1.hotel-title {
            margin: 0 0 10px;
            font-size: 32px;
            color: #1e293b;
        }
        .location {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .tag {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
        }
        .description {
            line-height: 1.7;
            color: #334155;
            margin-bottom: 30px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #334155;
            font-weight: 500;
        }
        .booking-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            height: fit-content;
            position: sticky;
            top: 24px;
            color: #0f172a;
        }
        .price-tag {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .price-period {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-book {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn-book:hover {
            background: #1d4ed8;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #475569;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .hero-image {
                height: 250px;
            }
        }
    </style>
</head>
<body th:style="'background: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.8)), url(' + ${hotel.images[0]} + ') center center / cover no-repeat fixed;'">

<header>
    <h1>HotellbookingMaroc</h1>
    <a href="/hotels">← Retour aux hôtels</a>
</header>

<main>
    <!-- Slider d'images automatique -->
    <div class="slider-container">
        <div class="slider-track">
            <!-- Dynamic Images -->
            <div th:each="image : ${hotel.images}" class="slide" th:style="'background-image: url(' + ${image} + ');'"></div>
        </div>
    </div>

    <div class="content-grid">
        <!-- Colonne gauche : Infos détaillées -->
        <div class="details-card">
            <h1 class="hotel-title" th:text="${hotel.name}">Nom de l'hôtel</h1>
            <div class="location" th:text="'📍 ' + ${hotel.city}">
                📍 Ville
            </div>
            
            <div class="tags">
                <span class="tag" th:text="${hotel.badge}">Badge</span>
                <span class="tag" style="background: #f0fdf4; color: #166534;">Meilleur prix</span>
                <span class="tag" style="background: #fff7ed; color: #c2410c;">Très demandé</span>
            </div>

            <div class="description">
                <p th:text="${hotel.description}">Description de l'hôtel...</p>
            </div>

            <h3>Équipements de l'hôtel</h3>
            <div class="features">
                <div class="feature" th:each="feature : ${hotel.features}" th:text="'✨ ' + ${feature}">✨ Équipement</div>
            </div>
        </div>

        <!-- Colonne droite : Carte de réservation -->
        <div class="booking-card">
            <div class="price-tag" th:text="${hotel.price} + ' MAD'">Prix</div>
            <div class="price-period">par nuit</div>
            
            <div class="info-row">
                <span>Note voyageurs</span>
                <span style="color: #ea580c; font-weight: bold;" th:text="${hotel.rating} + '/5 ★'">Note</span>
            </div>
            <div class="info-row">
                <span>Disponibilité</span>
                <span style="color: #166534; font-weight: bold;">En stock</span>
            </div>
            
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 16px 0;">
            
            <!-- Mode ADMIN : Boutons de gestion -->
            <div th:if="${session.userRole == 'ADMIN'}">
                <button class="btn-book" style="background: #2563eb;" onclick="alert('Formulaire de modification (Simulation)\n\nL\'administrateur peut ici modifier les détails de l\'hôtel.')">Modifier l'hôtel</button>
                <button class="btn-book" style="background: #dc2626;" onclick="alert('Hôtel supprimé ! (Simulation)')">Supprimer l'hôtel</button>
            </div>

            <!-- Mode USER : Bouton Réserver -->
            <a th:unless="${session.userRole == 'ADMIN'}" href="/reservation" class="btn-book">Réserver maintenant</a>
            
            <p style="text-align: center; color: #64748b; font-size: 12px; margin: 0;">
                <span th:if="${session.userRole == 'ADMIN'}">Mode Gestion Administrateur</span>
                <span th:unless="${session.userRole == 'ADMIN'}">Aucun prélèvement immédiat</span>
            </p>
        </div>
    </div>
</main>

</body>
</html>
