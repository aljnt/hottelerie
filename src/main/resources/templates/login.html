<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - HotelBookingPro</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Important pour que le padding ne dépasse pas */
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1d4ed8; }
        .hint {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
        }
        .error {
            color: red;
            background: #fee2e2;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Connexion</h2>
        
        <div th:if="${error}" class="error">
            <span th:text="${error}"></span>
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" placeholder="ex: admin" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" placeholder="ex: admin" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>

        <div class="hint">
            <strong>Pour tester :</strong><br>
            Admin : admin / admin<br>
            Client : user / user
        </div>
        <br>
        <a href="/" style="color: #666; text-decoration: none; font-size: 14px;">← Retour à l'accueil</a>
    </div>

</body>
</html>
